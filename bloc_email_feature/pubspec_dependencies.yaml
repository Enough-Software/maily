# ========================================
# Copy these dependencies to your pubspec.yaml
# ========================================

dependencies:
  flutter:
    sdk: flutter

  # State Management - BLoC Pattern
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Email Protocol (IMAP/SMTP)
  enough_mail: ^2.1.7

  # Utilities
  intl: ^0.19.0  # Date formatting and localization

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing BLoCs
  bloc_test: ^9.1.4

  # Mocking for tests
  mocktail: ^1.0.0

# ========================================
# After adding, run:
# flutter pub get
# ========================================

